spring:
  application:
    name: myuser
  main:
    lazy-initialization: false
  # DataSource Config
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/cyuniverse?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&connectTimeout=5000&socketTimeout=30000
    username: root
    password: '1'
    hikari:
      connection-timeout: 30000
      validation-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
      maximum-pool-size: 10
      minimum-idle: 1
#session失效时间
server:
  port: 8080
  servlet:
    #context-path: /api
    session:
      timeout: 86400

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false  # 数据库使用驼峰命名，关闭下划线转驼峰
  global-config:
    db-config:
      logic-delete-field: isDelete # 全局逻辑删除字段名(deleted为实体类属性名称)
      logic-delete-value: 1 # 逻辑已删除值。可选，默认值为 1
      logic-not-delete-value: 0 # 逻辑未删除值。可选，默认值为 0
