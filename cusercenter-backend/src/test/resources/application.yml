spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password: ''
  sql:
    init:
      mode: always

# Keep mybatis-plus basic config for tests
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false

